<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>My Library</title>
</head>

<body>
    <div class="container">
        <div class="sidebar">
            <form id="myForm">
                <div>
                    <label for="title">Title:</label>
                    <input type="text" name="title" id="title" required>
                </div>
                <div>
                    <label for="author">Author:</label>
                    <input type="text" name="author" id="author" required>
                </div>
                <div>
                    <label for="year">Year:</label>
                    <input type="number" name="year" id="year">                    
                </div>
                <div>
                    <label for="language">Language:</label>
                    <input type="text" name="language" id="language" list="languageList">
                    <datalist id="languageList">
                        <option value="English">English</option>
                        <option value="Spanish">Spanish</option>
                        <option value="French">French</option>
                        <option value="Russian">Russian</option>
                        <option value="Chinese">Chinese</option>
                        <option value="Croatian">Croatian</option>
                        <option value="Portuguese">Portuguese</option>
                        <option value="German">German</option>
                        <option value="Italian">Italian</option>
                    </datalist>                    
                </div>
                <div>
                    <label for="pages">Pages:</label>
                    <input type="number" name="pages" id="pages">                    
                </div>
                <fieldset>
                    <label for="read">Read:</label>
                    <input type="radio" id="read-radio" name="read" value="true" checked>
                    <label for="unread">Not read:</label>
                    <input type="radio" id="unread-radio" name="read" value="false">
                </fieldset>

                <button type="submit" id="submit">Add book</button>
            </form>
        </div>
        <div id="library">
        </div>
    </div>
    <script src="./app.js"></script>
</body>

</html>
